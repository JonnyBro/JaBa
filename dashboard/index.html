<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="JaBa dashboard - manage the bot on your Discord servers." />
		<title>JaBa</title>
		<!-- Apply the saved theme before the app loads to avoid a flashbang -->
		<script>
			(function () {
				var themes = { dark: 1, light: 0, amoled: 1 };
				var accents = { red: 1, violet: 1, green: 1, amber: 1, blue: 1 };
				var theme = "dark";
				var accent = "red";
				try {
					var savedTheme = localStorage.getItem("jaba-theme");
					var savedAccent = localStorage.getItem("jaba-accent");
					if (savedTheme && savedTheme in themes) theme = savedTheme;
					if (savedAccent && savedAccent in accents) accent = savedAccent;
				} catch (e) {}
				document.documentElement.dataset.theme = theme;
				document.documentElement.dataset.accent = accent;
				if (themes[theme]) document.documentElement.classList.add("dark");
			})();
		</script>
	</head>

	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
